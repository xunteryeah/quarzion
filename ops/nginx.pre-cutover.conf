resolver 127.0.0.11 valid=10s ipv6=off;

limit_req_zone $binary_remote_addr zone=quarzion_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=quarzion_contact:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=quarzion_customer:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=quarzion_admin:10m rate=10r/s;
limit_req_status 429;

map $uri $quarzion_log_uri {
  ~^/invite/ /invite/[REDACTED];
  default $uri;
}

log_format quarzion_json escape=json '{'
  '"time":"$time_iso8601",'
  '"request_id":"$request_id",'
  '"remote_addr":"$remote_addr",'
  '"host":"$host",'
  '"method":"$request_method",'
  '"uri":"$quarzion_log_uri",'
  '"status":$status,'
  '"bytes":$body_bytes_sent,'
  '"request_time":$request_time,'
  '"upstream_time":"$upstream_response_time",'
  '"user_agent":"$http_user_agent"'
  '}';

error_log /var/log/nginx/error.log warn;

server {
    listen 80;
    server_name windcall.cn www.windcall.cn admin.windcall.cn;
    access_log /var/log/nginx/access.log quarzion_json;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 80;
    server_name furo.art www.furo.art;
    access_log /var/log/nginx/access.log quarzion_json;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://windcall.cn$request_uri; }
}

server {
    listen 80;
    server_name api.furo.art;
    access_log /var/log/nginx/access.log quarzion_json;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://admin.windcall.cn$request_uri; }
}

server {
    listen 443 ssl;
    server_name windcall.cn;
    access_log /var/log/nginx/access.log quarzion_json;
    ssl_certificate /etc/letsencrypt/live/windcall.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/windcall.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 2m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Request-ID $request_id always;

    location = /api/auth/login {
        limit_req zone=quarzion_login burst=5 nodelay;
        set $frontend frontend;
        proxy_pass http://$frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location = /api/contact {
        limit_req zone=quarzion_contact burst=3 nodelay;
        set $frontend frontend;
        proxy_pass http://$frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location / {
        limit_req zone=quarzion_customer burst=30 nodelay;
        set $frontend frontend;
        proxy_pass http://$frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}

server {
    listen 443 ssl;
    server_name www.windcall.cn;
    access_log /var/log/nginx/access.log quarzion_json;
    ssl_certificate /etc/letsencrypt/live/windcall.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/windcall.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://windcall.cn$request_uri;
}

server {
    listen 443 ssl;
    server_name admin.windcall.cn;
    access_log /var/log/nginx/access.log quarzion_json;
    ssl_certificate /etc/letsencrypt/live/windcall.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/windcall.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 2m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options DENY always;
    add_header X-Request-ID $request_id always;

    auth_basic "WindCall Admin";
    auth_basic_user_file /etc/nginx/secrets/admin.htpasswd;

    location / {
        limit_req zone=quarzion_admin burst=30 nodelay;
        set $admin admin;
        proxy_pass http://$admin:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-WindCall-Admin "1";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}

server {
    listen 443 ssl;
    server_name furo.art www.furo.art;
    access_log /var/log/nginx/access.log quarzion_json;
    ssl_certificate /etc/letsencrypt/live/furo.art/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/furo.art/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://windcall.cn$request_uri;
}

server {
    listen 443 ssl;
    server_name api.furo.art;
    access_log /var/log/nginx/access.log quarzion_json;
    ssl_certificate /etc/letsencrypt/live/api.furo.art/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.furo.art/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://admin.windcall.cn$request_uri;
}
