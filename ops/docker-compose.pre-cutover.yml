name: quarzion

services:
  frontend:
    build: { context: ./frontend, dockerfile: Dockerfile }
    container_name: quarzion-frontend
    env_file: [.env]
    environment: { HOST: 0.0.0.0, PORT: 3000, QUARZION_DB_PATH: /data/quarzion.sqlite }
    volumes: [frontend-data:/data]
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/dashboard').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 8s
      retries: 8
      start_period: 30s
    init: true
    security_opt: ["no-new-privileges:true"]
    mem_limit: 900m
    logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }
    restart: unless-stopped

  admin:
    build: { context: ./admin, dockerfile: Dockerfile }
    container_name: quarzion-admin
    environment:
      HOST: 0.0.0.0
      PORT: 3001
      QUARZION_ADMIN_DB_PATH: /data/quarzion-admin.sqlite
      QUARZION_ADMIN_MIGRATION_PATH: /app/drizzle/0000_married_bucky.sql
      QUARZION_SELF_HOSTED_ADMIN: "1"
    volumes: [admin-data:/data]
    expose: ["3001"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 8s
      retries: 8
      start_period: 30s
    init: true
    security_opt: ["no-new-privileges:true"]
    mem_limit: 700m
    logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: quarzion-nginx
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./secrets:/etc/nginx/secrets:ro
      - ./acme:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      frontend: { condition: service_healthy }
      admin: { condition: service_healthy }
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }
    restart: unless-stopped

volumes:
  frontend-data:
  admin-data:
