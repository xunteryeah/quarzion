<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 48" role="img" aria-labelledby="title desc">
  <title id="title">Quarzion</title>
  <desc id="desc">由四个圆角菱形和 Quarzion 字标组成的横版标志</desc>
  <g transform="translate(10 10)">
    <g fill="#11100E" transform="rotate(45 14 14)">
      <rect x="0" y="0" width="12" height="12" rx="3"/>
      <rect x="16" y="0" width="12" height="12" rx="3"/>
      <rect x="0" y="16" width="12" height="12" rx="3"/>
      <rect x="16" y="16" width="12" height="12" rx="3"/>
    </g>
  </g>
  <text x="55" y="34" fill="#11100E" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="-1.8">Quarzion</text>
</svg>
