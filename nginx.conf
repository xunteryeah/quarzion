resolver 127.0.0.11 valid=10s ipv6=off;

# New public domain: always use the apex host as the canonical URL.
server {
    listen 80;
    server_name quarzion.com www.quarzion.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://quarzion.com$request_uri;
    }
}

# New admin domain.
server {
    listen 80;
    server_name admin.quarzion.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://admin.quarzion.com$request_uri;
    }
}

# Keep the old domains alive as permanent redirects so bookmarks and SEO value
# move to Quarzion without breaking existing links.
server {
    listen 80;
    server_name furo.art www.furo.art;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://quarzion.com$request_uri;
    }
}

server {
    listen 80;
    server_name api.furo.art;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://admin.quarzion.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name quarzion.com;

    ssl_certificate /etc/letsencrypt/live/quarzion.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quarzion.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 2m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        set $frontend frontend;
        proxy_pass http://$frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}

server {
    listen 443 ssl;
    server_name www.quarzion.com;

    ssl_certificate /etc/letsencrypt/live/quarzion.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quarzion.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://quarzion.com$request_uri;
}

server {
    listen 443 ssl;
    server_name admin.quarzion.com;

    ssl_certificate /etc/letsencrypt/live/quarzion.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quarzion.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 2m;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    auth_basic "Quarzion Admin";
    auth_basic_user_file /etc/nginx/secrets/admin.htpasswd;

    location / {
        set $admin admin;
        proxy_pass http://$admin:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Quarzion-Admin "1";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}

server {
    listen 443 ssl;
    server_name furo.art www.furo.art;

    ssl_certificate /etc/letsencrypt/live/furo.art/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/furo.art/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://quarzion.com$request_uri;
}

server {
    listen 443 ssl;
    server_name api.furo.art;

    ssl_certificate /etc/letsencrypt/live/api.furo.art/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.furo.art/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://admin.quarzion.com$request_uri;
}
