name: quarzion

services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: quarzion-frontend
    env_file:
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      QUARZION_DB_PATH: /data/quarzion.sqlite
      QUARZION_MIGRATION_PATH: /app/database/migrations/0001_unified.sql
      QUARZION_MIGRATION_DIR: /app/database/migrations
    volumes:
      - unified-data:/data
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 8s
      retries: 8
      start_period: 30s
    init: true
    security_opt:
      - no-new-privileges:true
    mem_limit: 900m
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
    container_name: quarzion-admin
    env_file:
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: 3001
      QUARZION_DB_PATH: /data/quarzion.sqlite
      QUARZION_MIGRATION_PATH: /app/database/migrations/0001_unified.sql
      QUARZION_MIGRATION_DIR: /app/database/migrations
      QUARZION_SELF_HOSTED_ADMIN: "1"
    volumes:
      - unified-data:/data
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 8s
      retries: 8
      start_period: 30s
    init: true
    security_opt:
      - no-new-privileges:true
    mem_limit: 700m
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: quarzion-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./secrets:/etc/nginx/secrets:ro
      - ./acme:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      frontend:
        condition: service_healthy
      admin:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    restart: unless-stopped

volumes:
  unified-data:
  frontend-data:
  admin-data:
